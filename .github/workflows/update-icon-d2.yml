name: Update ICON-D2 Weather Data

on:
  schedule:
    # Run every 3 hours at minute 0
    - cron: '0 */3 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-weather-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
      
      - name: Download and process ICON-D2 weather data
        run: python scripts/download_icon_d2.py
      
      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet public/data/icon-d2/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push weather data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/icon-d2/
          git commit -m "chore: update ICON-D2 weather data"
          git push
      
      - name: Notify skip
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "No changes in weather data"
