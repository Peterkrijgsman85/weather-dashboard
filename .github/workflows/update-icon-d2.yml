```yaml
name: Update ICON-D2

on:
  workflow_dispatch:

  schedule:
    # Elke 3 uur, iets na de verwachte modelrun
    - cron: "25 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install eccodes pillow numpy

      - name: Check ecCodes
        run: |
          python - <<'PY'
          import eccodes
          print("ecCodes Python binding OK")
          print(eccodes.codes_get_api_version())
          PY

      - name: Generate ICON-D2 data
        run: |
          python scripts/download_icon_d2.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          find public/data/icon-d2 -type f -print

          echo
          echo "Total size:"
          du -sh public/data/icon-d2

      - name: Commit updated model data
        run: |
          git config user.name "ICON-D2 Bot"
          git config user.email "icon-d2-bot@users.noreply.github.com"

          git add public/data/icon-d2

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ICON-D2 data"
            git push
          fi
```
