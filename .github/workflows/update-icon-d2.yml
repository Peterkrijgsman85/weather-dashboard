name: Update ICON-D2

on:
  workflow_dispatch:

  schedule:
    # Every 3 hours.
    - cron: "25 */3 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            eccodes \
            libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate ICON-D2 data
        run: |
          python scripts/download_icon_d2.py

      - name: Show generated data
        run: |
          find public/data/icon-d2 -maxdepth 1 -type f -print
          du -sh public/data/icon-d2

      - name: Commit updated model data
        run: |
          git config user.name "ICON-D2 Bot"
          git config user.email "icon-d2-bot@users.noreply.github.com"

          git add public/data/icon-d2

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ICON-D2 data"
            git push
          fi
